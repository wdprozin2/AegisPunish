<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" width="100%" height="220" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="chartFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF" stop-opacity="0.28" />
      <stop offset="60%" stop-color="#00D2FF" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#00D2FF" stop-opacity="0.0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Box with Apple HIG subtle 1px border and 16px corner radius -->
  <rect x="1" y="1" width="758" height="218" rx="16" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" />

  <!-- Top Banner / Header Area -->
  <g transform="translate(24, 24)">
    <!-- bStats Iconic Bar Chart Symbol -->
    <g transform="translate(0, 2)">
      <rect x="0" y="12" width="6" height="20" rx="3" fill="#00D2FF" />
      <rect x="10" y="4" width="6" height="28" rx="3" fill="#38BDF8" />
      <rect x="20" y="18" width="6" height="14" rx="3" fill="#60A5FA" />
      <rect x="30" y="0" width="6" height="32" rx="3" fill="#818CF8" />
    </g>

    <!-- Header Texts -->
    <g transform="translate(48, 0)">
      <text x="0" y="16" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="700" fill="#F8FAFC" letter-spacing="-0.01em">
        AegisPunish <tspan fill="#64748B" font-weight="400">— bStats Telemetry</tspan>
      </text>
      <text x="0" y="32" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#94A3B8">
        Bukkit • Spigot • Paper • Folia • Bungee • Velocity <tspan fill="#475569">|</tspan> Plugin ID: <tspan fill="#38BDF8" font-weight="600">34230</tspan>
      </text>
    </g>

    <!-- Right Badge: Live Link Button -->
    <g transform="translate(560, 4)">
      <rect x="0" y="0" width="150" height="30" rx="15" fill="rgba(0, 210, 255, 0.08)" stroke="rgba(0, 210, 255, 0.28)" stroke-width="1" />
      <circle cx="16" cy="15" r="4" fill="#10B981" />
      <circle cx="16" cy="15" r="7" fill="#10B981" fill-opacity="0.3" />
      <text x="28" y="19" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#38BDF8">Live Metrics ↗</text>
    </g>
  </g>

  <!-- Key Metrics Row (4pt / 8pt grid) -->
  <g transform="translate(24, 82)">
    <!-- Metric 1: Telemetry State -->
    <g transform="translate(0, 0)">
      <text x="0" y="10" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#64748B" letter-spacing="0.08em">STATUS</text>
      <text x="0" y="28" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#10B981">
        ● Online &amp; Collecting
      </text>
    </g>

    <!-- Metric 2: Platform Coverage -->
    <g transform="translate(180, 0)">
      <text x="0" y="10" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#64748B" letter-spacing="0.08em">COMPATIBILITY</text>
      <text x="0" y="28" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#E2E8F0">
        1.16.5 – 26.3+ Folia
      </text>
    </g>

    <!-- Metric 3: Dual Storage Telemetry -->
    <g transform="translate(370, 0)">
      <text x="0" y="10" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#64748B" letter-spacing="0.08em">STORAGE ENGINE</text>
      <text x="0" y="28" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#E2E8F0">
        MySQL + SQLite Fallback
      </text>
    </g>

    <!-- Metric 4: Verified ID -->
    <g transform="translate(560, 0)">
      <text x="0" y="10" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#64748B" letter-spacing="0.08em">BSTATS ID</text>
      <text x="0" y="28" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#38BDF8">
        #34230
      </text>
    </g>
  </g>

  <!-- Horizontal Divider Line -->
  <line x1="24" y1="126" x2="736" y2="126" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1" />

  <!-- Graph Grid Lines -->
  <line x1="24" y1="150" x2="736" y2="150" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1" stroke-dasharray="4 4" />
  <line x1="24" y1="180" x2="736" y2="180" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1" stroke-dasharray="4 4" />

  <!-- Dynamic Area Fill under Curve -->
  <path d="M 24 200 
           C 120 196, 200 185, 300 178 
           C 400 171, 480 162, 560 152 
           C 620 144, 680 138, 736 135 
           L 736 205 L 24 205 Z" 
        fill="url(#chartFill)" />

  <!-- Glowing Trend Line -->
  <path d="M 24 200 
           C 120 196, 200 185, 300 178 
           C 400 171, 480 162, 560 152 
           C 620 144, 680 138, 736 135" 
        fill="none" 
        stroke="url(#accentGrad)" 
        stroke-width="2.5" 
        filter="url(#glow)" />

  <!-- Data Point Nodes with glowing halos -->
  <circle cx="300" cy="178" r="3" fill="#00D2FF" />
  <circle cx="560" cy="152" r="3" fill="#38BDF8" />
  <circle cx="736" cy="135" r="4.5" fill="#38BDF8" />
  <circle cx="736" cy="135" r="8" fill="#00D2FF" fill-opacity="0.3" />

  <!-- Bottom Annotation -->
  <text x="24" y="208" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="500" fill="#475569">
    Real-Time Minecraft Server Telemetry via bStats.org Metrics • bstats.org/plugin/bukkit/AegisPunish/34230
  </text>
</svg>
